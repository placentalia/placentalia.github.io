<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiDict</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
  <style>
    body {
      --bc-color: hsl(202deg 70% 96% / 1);
      background-color: var(--bc-color);
    }

    .header {
      background-color: var(--bc-color);
      position: sticky;
      top: 0px;
    }
  </style>
</head>
<body>
  <div id="app" class="me-4">
    <form class="header my-2 py-2 px-1" @submit.prevent="go">
      <input
        v-model="search"
        class="form-control d-inline-block w-25"
        :placeholder="currentWord"
        autocapitalize="off"
        ref="inp"
      >
        <!-- @keyup.enter="addOwnTranslation()" -->
      <button type="submit" class="btn btn-primary ms-2">Go</button>
      <button type="button" class="btn btn-primary ms-2" @click="openNew">New</button>
      <!-- <select v-model="lang" class="form-control d-inline-block w-25">
        <option>EN</option>
        <option>RU</option>
      </select> -->
    </form>

    <iframe
      v-if="currentWord && lang === 'EN'"
      :key="currentWord"
      class="w-100 mb-4"
      :src="`https://www.etymonline.com/word/${currentWord}`"
      frameborder="0"
      :style="{ height: '90vh' }"
    ></iframe>
    <iframe
      v-if="currentWord && lang === 'RU'"
      :key="currentWord"
      class="w-100 mb-4"
      :src="`https://corsproxy.io/?key=92e42d75&url=https://lexicography.online/etymology/${currentWord[0]}/${currentWord}`"
      sandbox
      frameborder="0"
      :style="{ height: '90vh' }"
    ></iframe>

    <iframe
      v-if="currentWord"
      :key="currentWord"
      class="w-100 mb-4"
      :src="`https://en.wiktionary.org/wiki/${currentWord}#English`"
      frameborder="0"
      :style="{ height: '90vh' }"
    ></iframe>

    <!-- <iframe
      v-if="currentWord"
      class="w-100"
      :src="`https://www.onelook.com/?w=${currentWord}&ls=a`"
      frameborder="0"
      :style="{ height: '90vh' }"
    ></iframe> -->
    <!-- <iframe
      v-if="currentWord && lang === 'EN'"
      :key="currentWord"
      class="w-100 mb-4"
      :src="`https://corsproxy.io/?key=92e42d75&url=https://lexicography.online/etymology/%D1%81/%D1%81%D0%BB%D0%BE%D0%B2%D0%BE`"
      sandbox
      frameborder="0"
      :style="{ height: '90vh' }"
    ></iframe> -->
    <!-- <iframe src="https://www.vocabulary.com/dictionary/exploit" frameborder="0"></iframe>
    <iframe src="https://www.collinsdictionary.com/dictionary/english/exploit" frameborder="0"></iframe>
    <iframe src="https://dictionary.cambridge.org/dictionary/english/ethics" frameborder="0"></iframe> -->
  </div>

<script type="text/javascript">
Vue.config.devtools = true;

const app = new Vue({
  el: '#app',
  data: {
    search: '',
    currentWord: ''
  },

  mounted() {
    const { hash } = window.location
    if (hash) {
      this.setCurrentWord(decodeURIComponent(hash.slice(1)))
    }

    window.addEventListener('popstate', (ev) => this.setCurrentWord(ev.state))
    this.$refs.inp.focus()
  },

  methods: {
    setCurrentWord(newWord) {
      this.currentWord = newWord
      document.title = `${newWord} - MultiDict`
    },

    go() {
      const word = this.search
      history.pushState(word, '', '#' + word)
      this.setCurrentWord(word)
      this.search = ''
    },

    openNew() {
      window.open(`${window.location.href.replace(/#.*?$/, '')}#${this.search}`)
      this.search = ''
    }
  },

  computed: {
    lang() {
      return ~this.currentWord.search(/[а-яё]/i) ? 'RU' : 'EN'
    }
  }
})
</script>
</body>
</html>
